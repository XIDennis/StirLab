<main class="page-container">
  <header class="page-header">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </header>

  <div class="controls">
    @if (cocktailService.isLoading()) {
      <p class="library-status">Loading cocktail library...</p>
    } @else if (cocktailService.error()) {
      <p class="library-status error">{{ cocktailService.error() }}</p>
    }

    <app-cocktail-search (searchChange)="searchTerm.set($event)" />

    <app-ingredient-picker
      [showUnavailable]="showUnavailableCocktails()"
      (showUnavailableChange)="showUnavailableCocktails.set($event)"
    />

    <app-category-filter
      [categories]="categories()"
      [selectedCategory]="selectedCategory()"
      (categorySelected)="setCategory($event)"
    />
  </div>

  <section class="cocktail-grid" aria-label="Cocktail results">
    @for (match of filteredCocktails(); track match.cocktail.id) {
      <app-cocktail-card
        [name]="match.cocktail.name"
        [category]="match.cocktail.category"
        [image]="match.cocktail.image"
        [ingredients]="match.cocktail.ingredients"
        [id]="match.cocktail.id"
        [missingIngredients]="
          availableIngredientKeys().length ? match.missingIngredients : undefined
        "
        [isReady]="match.isReady"
        [isUnavailable]="match.isUnavailable"
      />
    } @empty {
      <div class="empty-state">
        <h2>No cocktails found</h2>

        <p>Try another search or category.</p>
      </div>
    }
  </section>
</main>
