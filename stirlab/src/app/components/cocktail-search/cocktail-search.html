<section
  class="cocktail-search"
  aria-labelledby="search-label"
  (document:click)="blurSearchOnOutsideClick($event, searchInput)"
>
  <label id="search-label" for="cocktail-search-input">Search cocktails</label>
  <input
    #searchInput
    id="cocktail-search-input"
    type="text"
    placeholder="Search cocktails..."
    autocomplete="off"
    (input)="searchChange.emit(searchInput.value)"
    class="input-field"
  />
</section>
