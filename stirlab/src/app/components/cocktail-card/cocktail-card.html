<article class="cocktail-card" [class.ready-to-make]="isReady">
  <img [src]="image" [alt]="name" loading="lazy" />

  <div class="card-content">
    <span class="category">{{ category }}</span>

    <h2>{{ name }}</h2>

    <p>{{ description }}</p>

    @if (missingIngredients !== undefined) {
      <p class="ingredient-status" [class.ready-status]="isReady">
        @if (isReady) {
          Ready to make
        } @else {
          Missing {{ missingIngredients }}
          {{ missingIngredients === 1 ? 'ingredient' : 'ingredients' }}
        }
      </p>
    }

    <a [routerLink]="['/cocktails', id]" class="recipe-link">
      View recipe
    </a>
  </div>
</article>
