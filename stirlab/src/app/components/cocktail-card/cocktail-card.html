<article class="cocktail-card">
  <img [src]="image" [alt]="name" loading="lazy" />

  <div class="card-content">
    <span class="category">{{ category }}</span>

    <h2>{{ name }}</h2>

    <p>{{ description }}</p>

    <a
      [routerLink]="['/cocktails', id]"
      class="recipe-link"
    >
      View recipe
    </a>
  </div>
</article>
